<title>IBM Cloud IaaS 101</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&family=IBM+Plex+Sans:wght@300;400;600&display=swap">
<style>
/* Layout: intro, then the 4-column pillar row; a selected pillar's lines open BELOW the row
   (anchored under that pillar), pushing the foundation bar down.
   Carbon White theme by default; Gray 100 when the viewer switches to dark. */
:root {
  color-scheme: light;
  --bg: #ffffff;          /* Carbon background */
  --layer: #f4f4f4;       /* layer-01 */
  --layer-2: #e0e0e0;     /* layer-accent-01 */
  --hover: #e8e8e8;       /* layer-hover-01 */
  --line: #c6c6c6;        /* border-subtle on layer */
  --text: #161616;
  --text-2: #525252;
  --label: #0f62fe;
  --accent: #0f62fe;      /* Blue 60 */
  --on-accent: #ffffff;
  --on-accent-2: #d0e2ff; /* Blue 20 */
  --focus: #0f62fe;
  /* Row tones (Carbon palette): bg = 10, card edge = 20, stripe/number = 60 */
  --cyan-bg: #e5f6ff;    --cyan-edge: #bae6ff;    --cyan-ink: #0072c3;
  --purple-bg: #f6f2ff;  --purple-edge: #e8daff;  --purple-ink: #8a3ffc;
  --teal-bg: #d9fbfb;    --teal-edge: #9ef0f0;    --teal-ink: #007d79;
  --magenta-bg: #fff0f7; --magenta-edge: #ffd6e8; --magenta-ink: #d02670;
  --font-sans: 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif;
  --font-mono: 'IBM Plex Mono', Menlo, 'Courier New', monospace;
  --gap: 16px;
  --ease: cubic-bezier(0.2, 0, 0.38, 0.9);
}
/* Dark mode = Carbon Gray 100 theme. Set by the page's own toggle (data-mode on <html>),
   so light stays the default whatever the viewer's system setting is. */
:root[data-mode="dark"] {
  --bg: #161616;          /* background */
  --layer: #262626;       /* layer-01 */
  --layer-2: #393939;     /* layer-accent-01 */
  --hover: #333333;       /* layer-hover-01 */
  --line: #525252;        /* border-subtle on layer */
  --text: #f4f4f4;
  --text-2: #c6c6c6;
  --label: #78a9ff;       /* Blue 40 */
  --accent: #0f62fe; --on-accent: #ffffff; --on-accent-2: #d0e2ff; --focus: #ffffff;
  /* dark row tones: bg = 100, card edge = 80, stripe/number = 40 */
  --cyan-bg: #061727; --cyan-edge: #003a6d; --cyan-ink: #33b1ff;
  --purple-bg: #1c0f30; --purple-edge: #491d8b; --purple-ink: #be95ff;
  --teal-bg: #081a1c; --teal-edge: #004144; --teal-ink: #08bdba;
  --magenta-bg: #2a0a18; --magenta-edge: #740937; --magenta-ink: #ff7eb6;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-sans);
  font-size: 16px;
  line-height: 1.5;
  padding-inline: 16px;
}
.wrap {
  max-width: 1312px;
  margin-inline: auto;
  padding-block: 48px 64px;
  display: flex;
  flex-direction: column;
  gap: var(--gap);
}
.eyebrow {
  font-family: var(--font-mono);
  font-size: 0.875rem;
  font-weight: 400;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--label);
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }

/* ---------- Intro ---------- */
.intro { display: flex; flex-direction: column; gap: 12px; padding-bottom: 24px; }
.intro h1 { margin: 0; font-size: clamp(2.25rem, 5vw, 3.75rem); font-weight: 300; line-height: 1.1; text-wrap: balance; }
.intro p { margin: 0; font-size: 1.25rem; color: var(--text-2); max-width: 40rem; }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }

/* Theme switch, styled as a Carbon ghost button with an icon */
.mode-toggle {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  min-height: 40px;
  padding: 0 16px;
  background: transparent;
  border: 1px solid var(--line);
  color: var(--text);
  font-size: 0.875rem;
  cursor: pointer;
  transition: background-color 160ms var(--ease);
}
.mode-toggle:hover { background: var(--hover); }
.mode-toggle svg { width: 16px; height: 16px; }

/* ---------- Pillars ---------- */
.pillars { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--gap); align-items: start; }
.tile { min-width: 0; transition: opacity 240ms var(--ease); }
.wrap[data-selected] .tile:not(.is-active) { opacity: 0.35; }

.tile-head {
  position: relative;
  width: 100%;
  min-height: 220px;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 8px;
  padding: 24px;
  text-align: left;
  background: var(--layer);
  border: 0;
  border-top: 4px solid var(--accent);
  cursor: pointer;
  transition: background-color 160ms var(--ease);
}
.tile-head:not([aria-disabled="true"]):hover { background: var(--hover); }
.tile-head .icon { width: 48px; height: 48px; color: var(--label); margin-bottom: auto; }
.tile-head .eyebrow { margin-top: 32px; }
.tile-title { font-size: 1.75rem; font-weight: 400; line-height: 1.2; text-wrap: balance; padding-right: 32px; }
.chevron { position: absolute; right: 20px; bottom: 24px; width: 20px; height: 20px; color: var(--text-2); transition: transform 240ms var(--ease); }
.tile.is-active .tile-head { background: var(--accent); color: var(--on-accent); }
.tile.is-active .tile-head .icon,
.tile.is-active .tile-head .chevron { color: var(--on-accent); }
.tile.is-active .tile-head .eyebrow { color: var(--on-accent-2); }
.tile.is-active .chevron { transform: rotate(180deg); }

/* Pillars without 102 content yet */
.tile-head[aria-disabled="true"] { cursor: default; border-top-color: var(--line); }
.tile-head[aria-disabled="true"] .icon,
.tile-head[aria-disabled="true"] .eyebrow { color: var(--text-2); }
.soon {
  position: absolute; top: 24px; right: 20px;
  font-size: 0.75rem; padding: 2px 10px; border-radius: 999px;
  background: var(--layer-2); color: var(--text-2);
}

/* ---------- Lines below the pillars ---------- */
/* The region animates open (0fr -> 1fr) and pushes the foundation bar down */
.below { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 360ms var(--ease); }
.wrap[data-selected] .below { grid-template-rows: 1fr; }
.below-inner { min-height: 0; overflow: hidden; }
/* Pull the region up into the row gap so the pointer touches the open tile */
.wrap[data-selected] .below { margin-top: calc(-1 * var(--gap)); }
.below-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); column-gap: var(--gap); }
/* Pointer: a blue tab under the selected pillar only (its column is set from JS) */
.pointer { grid-row: 1; height: var(--gap); background: var(--accent); }
/* The lines span the full width of all four pillars */
.below-grid .lines {
  grid-row: 2;
  grid-column: 1 / -1;
  border-left: 0;
  border-top: 2px solid var(--accent);
}

/* Lines flow downward: line 1 sits right under the box */
.lines {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 8px;
  border-left: 2px solid var(--accent); /* spine dropping from the pillar's left edge */
}
.lines > li {
  display: flex;
  flex-direction: column;
  gap: 16px;
  padding: 20px 24px;
  background: var(--tone-bg, var(--layer));
  border-left: 4px solid var(--tone-ink, var(--accent)); /* row color stripe */
  animation: drop 380ms var(--ease) both;
  min-width: 0;
}
/* Each row picks one Carbon hue; its children read the generic --tone-* names */
.lines > li[data-tone="cyan"]    { --tone-bg: var(--cyan-bg);    --tone-edge: var(--cyan-edge);    --tone-ink: var(--cyan-ink); }
.lines > li[data-tone="purple"]  { --tone-bg: var(--purple-bg);  --tone-edge: var(--purple-edge);  --tone-ink: var(--purple-ink); }
.lines > li[data-tone="teal"]    { --tone-bg: var(--teal-bg);    --tone-edge: var(--teal-edge);    --tone-ink: var(--teal-ink); }
.lines > li[data-tone="magenta"] { --tone-bg: var(--magenta-bg); --tone-edge: var(--magenta-edge); --tone-ink: var(--magenta-ink); }
@keyframes drop { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: none; } }

.line-head { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
.line-head .num { font-family: var(--font-mono); font-size: 0.875rem; color: var(--tone-ink, var(--label)); }
.line-head h3 { margin: 0; font-size: 1.375rem; font-weight: 600; line-height: 1.3; }
.line-head .note { color: var(--text-2); }

/* Second level: one card per item, as many across as fit */
.items {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
  gap: 8px;
}
.items > li {
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 14px 16px;
  background: var(--bg);
  border: 1px solid var(--tone-edge, var(--line));
}
.items .name { font-weight: 600; }
.items .desc { color: var(--text-2); font-size: 0.9375rem; }
.items .placeholder { border-style: dashed; color: var(--text-2); }
.items .placeholder .name { font-weight: 400; font-style: italic; }
/* Third level: small tags under an item (e.g. Snapshots) */
/* stacked one per row so longer child names can wrap inside their tag */
.subs { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
.subs li {
  font-size: 0.8125rem;
  line-height: 1.4;
  padding: 2px 10px;
  border-radius: 12px;
  background: var(--layer-2);
  color: var(--text);
}
.subs li::before { content: "\21B3\00a0"; color: var(--tone-ink, var(--label)); } /* ↳ marks it as a child */

/* Service pills (Carbon tag style) with a 16px Carbon icon in the row's color */
.pills { list-style: none; margin: 4px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; }
.pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 28px;
  padding: 2px 12px 2px 8px;
  border-radius: 999px;
  background: var(--tone-bg, var(--layer));
  border: 1px solid var(--tone-edge, var(--line));
  color: var(--text);
  font-size: 0.8125rem;
  line-height: 1.3;
}
.pill a {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: inherit;
  text-decoration: none;
}
.pill svg { width: 16px; height: 16px; flex: none; color: var(--tone-ink, var(--label)); }
/* Deprecated service: muted pill with a small gray "Deprecated" tag */
.pill.deprecated { background: transparent; border-style: dashed; color: var(--text-2); }
.pill.deprecated svg { color: var(--text-2); }
.pill .badge {
  margin-left: 2px;
  padding: 0 6px;
  border-radius: 999px;
  background: var(--layer-2);
  color: var(--text);
  font-size: 0.6875rem;
  letter-spacing: 0.02em;
  text-transform: uppercase;
}
.pill.placeholder { background: transparent; border-style: dashed; color: var(--text-2); font-style: italic; padding-left: 12px; }

.tile-lines { display: none; margin-top: 8px; } /* used instead of .below on narrow screens */

/* ---------- Foundation bar (context only in 102) ---------- */
.foundation {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 16px 24px;
  padding: 24px;
  background: var(--layer-2);
}
.foundation .tile-title { padding-right: 0; }
.services { display: flex; flex-wrap: wrap; gap: 8px 32px; margin-left: auto; color: var(--text-2); }
.services span { display: inline-flex; align-items: center; gap: 8px; }
.services svg { width: 24px; height: 24px; }

.hint { margin: 8px 0 0; color: var(--text-2); font-size: 0.875rem; }
kbd { font-family: var(--font-mono); font-size: 0.8125rem; padding: 1px 6px; background: var(--layer); border: 1px solid var(--layer-2); }

/* ---------- Narrower screens: lines open inside the selected tile ---------- */
@media (max-width: 1023px) {
  .below { display: none; }
  .tile-lines { display: flex; }
  .pillars { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  /* the open tile takes the full row so its lines have room */
  .tile.is-active { grid-column: 1 / -1; }
  .tile-head { min-height: 180px; }
}
@media (max-width: 599px) {
  .wrap { padding-block: 32px 48px; }
  .pillars { grid-template-columns: minmax(0, 1fr); }
  .tile-head { min-height: 0; }
  .tile-head .eyebrow { margin-top: 16px; }
  .services { margin-left: 0; }
  .lines > li { padding: 16px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}
</style>

// --- small helpers ---------------------------------------------------------
const icon = (id, cls = "icon") => `<svg class="${cls}" aria-hidden="true" fill="currentColor"><use href="#${id}"/></svg>`;
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// One item card: name, optional description, optional child tags
function itemHTML(it) {
  return `<li class="${it.placeholder ? "placeholder" : ""}">
    <span class="name">${esc(it.name)}</span>
    ${it.desc ? `<span class="desc">${esc(it.desc)}</span>` : ""}
    ${it.subs ? `<ul class="subs">${it.subs.map((s) => `<li>${esc(s)}</li>`).join("")}</ul>` : ""}
    ${it.pills ? `<ul class="pills">${it.pills.map(pillHTML).join("")}</ul>` : ""}
  </li>`;
}

// One service pill: Carbon icon + label (title gives the full name on hover).
// docs: "" stays a non-link <li class="pill">. A non-empty docs URL wraps the
// icon and label in a link that opens in a new tab.
function pillHTML(p) {
  const cls = ["pill", p.placeholder && "placeholder", p.deprecated && "deprecated"].filter(Boolean).join(" ");
  const title = p.title ? ` title="${esc(p.title)}"` : "";
  const badgeText = p.deprecated ? "Deprecated" : p.badge;
  const badge = badgeText ? `<span class="badge">${esc(badgeText)}</span>` : "";
  const body = `${p.icon ? icon(p.icon, "") : ""}<span>${esc(p.label)}</span>${badge}`;
  const inner = p.docs
    ? `<a href="${esc(p.docs)}" target="_blank" rel="noopener noreferrer">${body}</a>`
    : body;
  return `<li class="${cls}"${title}>${inner}</li>`;
}

// Row colors in order (Carbon hues; defined as CSS tokens for light and dark)
const TONES = ["cyan", "purple", "teal", "magenta"];

// All lines for a pillar, numbered 01-04, each dropping in a beat after the last
function linesHTML(lines) {
  return lines.map((line, i) => `
    <li data-tone="${TONES[i % TONES.length]}" style="animation-delay:${i * 140}ms">
      <div class="line-head">
        <span class="num">0${i + 1}</span>
        <h3>${esc(line.title)}</h3>
        ${line.note ? `<span class="note">${esc(line.note)}</span>` : ""}
      </div>
      <ul class="items">${line.items.map(itemHTML).join("")}</ul>
    </li>`).join("");
}

function pillarHTML(p) {
  const ready = p.lines.length > 0;
  return `
  <article class="tile" data-id="${p.id}">
    <button class="tile-head" type="button" ${ready ? `aria-expanded="false" aria-controls="below-lines"` : `aria-disabled="true"`}>
      ${icon(p.icon)}
      ${ready ? "" : `<span class="soon">Coming soon</span>`}
      <span class="eyebrow">${esc(p.eyebrow)}</span>
      <span class="tile-title">${esc(p.title)}</span>
      ${ready ? icon("i-chevron", "chevron") : ""}
    </button>
    <ol class="lines tile-lines" aria-label="${esc(p.title)} building blocks"></ol>
  </article>`;
}

// --- render ----------------------------------------------------------------
const wrap = document.getElementById("wrap");
const belowLines = document.getElementById("below-lines");
document.getElementById("pillars").innerHTML = PILLARS.map(pillarHTML).join("");
const BY_ID = Object.fromEntries(PILLARS.map((p) => [p.id, p]));

// --- state: which pillar is open (null = nothing open) ---------------------
let selected = null;

function select(id) {
  selected = id === selected ? null : id; // selecting the open one closes it

  if (selected) wrap.dataset.selected = selected;
  else delete wrap.dataset.selected;

  document.querySelectorAll(".tile").forEach((tile) => {
    const active = tile.dataset.id === selected;
    tile.classList.toggle("is-active", active);
    const head = tile.querySelector(".tile-head");
    if (head.hasAttribute("aria-expanded")) head.setAttribute("aria-expanded", String(active));
    // in-tile copy for narrow screens
    tile.querySelector(".tile-lines").innerHTML = active ? linesHTML(BY_ID[selected].lines) : "";
  });

  // wide screens: the shared region under the pillar row (re-rendered so the drop replays)
  belowLines.innerHTML = selected ? linesHTML(BY_ID[selected].lines) : "";
  // put the pointer tab in the selected pillar's column (1-4)
  const col = PILLARS.findIndex((p) => p.id === selected) + 1;
  if (col > 0) document.getElementById("below-pointer").style.gridColumn = String(col);
}

document.addEventListener("click", (e) => {
  const head = e.target.closest(".tile-head");
  if (head) {
    if (head.getAttribute("aria-disabled") !== "true") select(head.closest(".tile").dataset.id);
    return;
  }
  // a click outside the pillars and their lines closes the open one
  if (selected && !e.target.closest(".tile, .below")) select(selected);
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && selected) {
    const head = document.querySelector(`.tile[data-id="${selected}"] .tile-head`);
    select(selected);
    head && head.focus();
  }
});

// --- light / dark mode -----------------------------------------------------
// Light is the default. The choice is remembered in this browser only; storage can
// be unavailable (private windows, previews), so every read/write is guarded.
const MODE_KEY = "iaas102-mode";
const modeBtn = document.getElementById("mode-toggle");

function applyMode(mode) {
  const dark = mode === "dark";
  if (dark) document.documentElement.dataset.mode = "dark";
  else delete document.documentElement.dataset.mode;
  modeBtn.setAttribute("aria-pressed", String(dark));
  // the button names the mode you'd switch TO, with the matching Carbon icon
  document.getElementById("mode-label").textContent = dark ? "Light mode" : "Dark mode";
  document.getElementById("mode-icon").setAttribute("href", dark ? "#i-light" : "#i-asleep");
}

let savedMode = "light";
try { savedMode = localStorage.getItem(MODE_KEY) || "light"; } catch (e) { /* storage blocked: stay light */ }
applyMode(savedMode);

modeBtn.addEventListener("click", () => {
  const next = document.documentElement.dataset.mode === "dark" ? "light" : "dark";
  applyMode(next);
  try { localStorage.setItem(MODE_KEY, next); } catch (e) { /* not saved; still switches */ }
});

// Deep link: #vpc opens VPC on load
const fromHash = location.hash.slice(1);
if (BY_ID[fromHash] && BY_ID[fromHash].lines.length) select(fromHash);
</script>

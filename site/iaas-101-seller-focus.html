<title>IBM Cloud IaaS Explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&family=IBM+Plex+Sans:wght@300;400;600&display=swap">
<style>
/* Layout: a "stage" row (intro or the selected pillar's lines) over a 4-column pillar grid,
   resting on a full-width foundation bar. Carbon White theme in light, Gray 100 in dark. */
:root {
  --bg: #ffffff;          /* Carbon background */
  --layer: #f4f4f4;       /* layer-01 */
  --layer-2: #e0e0e0;     /* layer-accent-01: foundation bar, tags */
  --hover: #e8e8e8;       /* layer-hover-01 */
  --text: #161616;        /* text-primary */
  --text-2: #525252;      /* text-secondary */
  --label: #0f62fe;       /* eyebrow labels */
  --accent: #0f62fe;      /* Blue 60: selection */
  --on-accent: #ffffff;
  --on-accent-2: #d0e2ff; /* Blue 20 */
  --focus: #0f62fe;
  --font-sans: 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif;
  --font-mono: 'IBM Plex Mono', Menlo, 'Courier New', monospace;
  --gap: 16px;
  --ease: cubic-bezier(0.2, 0, 0.38, 0.9); /* Carbon productive easing */
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161616; --layer: #262626; --layer-2: #393939; --hover: #333333;
    --text: #f4f4f4; --text-2: #c6c6c6; --label: #78a9ff;
    --accent: #0f62fe; --on-accent: #ffffff; --on-accent-2: #d0e2ff; --focus: #ffffff;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #161616; --layer: #262626; --layer-2: #393939; --hover: #333333;
  --text: #f4f4f4; --text-2: #c6c6c6; --label: #78a9ff;
  --accent: #0f62fe; --on-accent: #ffffff; --on-accent-2: #d0e2ff; --focus: #ffffff;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-sans);
  font-size: 16px;
  line-height: 1.5;
  padding-inline: 16px;
}
.wrap {
  max-width: 1312px;
  margin-inline: auto;
  padding-block: 48px 64px;
  display: flex;
  flex-direction: column;
  gap: var(--gap);
}
.eyebrow {
  font-family: var(--font-mono);
  font-size: 0.875rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--label);
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }

/* ---------- Stage: intro text and the selected pillar's lines share one cell ---------- */
.stage {
  display: grid;
  min-height: 260px;
  padding-bottom: 8px;
}
.intro, .stage-lines { grid-area: 1 / 1; align-self: end; }
.intro { display: flex; flex-direction: column; gap: 12px; transition: opacity 240ms var(--ease), transform 240ms var(--ease); }
.intro h1 {
  margin: 0;
  font-size: clamp(2.25rem, 5vw, 3.75rem);
  font-weight: 300;
  line-height: 1.1;
  text-wrap: balance;
}
.intro p { margin: 0; font-size: 1.25rem; color: var(--text-2); max-width: 40rem; }
.wrap[data-selected] .intro { opacity: 0; transform: translateY(-8px); pointer-events: none; }

.stage-lines {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: var(--gap);
}
/* The line block spans two columns, anchored over the selected pillar */
.stage-lines .lines { grid-column: 1 / span 2; }
.stage-lines .lines[data-anchor="vpc"],
.stage-lines .lines[data-anchor="powervs"] { grid-column: 2 / span 2; }
.stage-lines .lines[data-anchor="ocpv"] { grid-column: 3 / span 2; }

/* Lines stack upward: item 1 sits closest to the box */
.lines {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column-reverse;
  gap: 8px;
}
.lines li {
  display: flex;
  align-items: baseline;
  gap: 16px;
  padding: 12px 20px;
  background: var(--layer);
  border-left: 4px solid var(--accent);
  font-size: 1.125rem;
  animation: rise 360ms var(--ease) both;
  min-width: 0;
}
.lines li .num { font-family: var(--font-mono); font-size: 0.875rem; color: var(--label); }
.lines[data-side="right"] li { flex-direction: row-reverse; border-left: 0; border-right: 4px solid var(--accent); text-align: right; }
@keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

/* ---------- Pillars ---------- */
.pillars {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: var(--gap);
  align-items: start;
}
.tile { min-width: 0; transition: opacity 240ms var(--ease); }
.wrap[data-selected] .tile:not(.is-active) { opacity: 0.35; }
.wrap[data-selected] .tile:not(.is-active):hover { opacity: 0.7; }

.tile-head {
  position: relative;
  width: 100%;
  min-height: 248px;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 8px;
  padding: 24px;
  text-align: left;
  background: var(--layer);
  border: 0;
  border-top: 4px solid var(--accent);
  cursor: pointer;
  transition: background-color 160ms var(--ease);
}
.tile-head:hover { background: var(--hover); }
.tile-head .icon { width: 48px; height: 48px; color: var(--label); margin-bottom: auto; }
.tile-head .eyebrow { margin-top: 32px; }
.tile-title { font-size: 1.75rem; font-weight: 400; line-height: 1.2; text-wrap: balance; padding-right: 32px; }
.chevron {
  position: absolute; right: 20px; bottom: 24px;
  width: 20px; height: 20px; color: var(--text-2);
  transition: transform 240ms var(--ease);
}
.tile.is-active .tile-head { background: var(--accent); color: var(--on-accent); }
.tile.is-active .tile-head .icon,
.tile.is-active .tile-head .chevron { color: var(--on-accent); }
.tile.is-active .tile-head .eyebrow { color: var(--on-accent-2); }
.tile.is-active .chevron { transform: rotate(180deg); }

/* The panel grows the tile downward (0fr -> 1fr row animates the height) */
.panel {
  display: grid;
  grid-template-rows: 0fr;
  transition: grid-template-rows 320ms var(--ease);
}
.tile.is-active .panel { grid-template-rows: 1fr; }
.panel-inner {
  overflow: hidden;
  min-height: 0;
  background: var(--layer);
  border: 0 solid var(--accent);
}
.tile.is-active .panel-inner { border-width: 0 2px 2px; }
.panel-body { padding: 24px; display: flex; flex-direction: column; gap: 20px; }
.panel-body p { margin: 0; color: var(--text); }
.panel-body h3 { margin: 0 0 8px; }
.panel-body ul { margin: 0; padding-left: 1.1em; color: var(--text-2); display: flex; flex-direction: column; gap: 4px; }
.tags { list-style: none; padding: 0 !important; flex-direction: row !important; flex-wrap: wrap; gap: 8px !important; }
.tags li {
  font-size: 0.875rem;
  padding: 2px 10px;
  border-radius: 999px;
  background: var(--layer-2);
  color: var(--text);
}
.panel-lines { display: none; } /* shown inside the tile on narrow screens */

/* ---------- Foundation bar ---------- */
.foundation .tile-head {
  min-height: 0;
  flex-direction: row;
  flex-wrap: wrap;
  align-items: center;
  gap: 16px 24px;
  padding: 24px 64px 24px 24px;
  background: var(--layer-2);
}
.foundation .tile-head:hover { background: var(--hover); }
.foundation .tile-head .eyebrow { margin: 0; }
.foundation .tile-title { padding-right: 0; }
.foundation .chevron { bottom: auto; top: 50%; margin-top: -10px; }
.services { display: flex; flex-wrap: wrap; gap: 8px 32px; margin-left: auto; color: var(--text-2); }
.services span { display: inline-flex; align-items: center; gap: 8px; }
.services svg { width: 24px; height: 24px; }
.tile.foundation.is-active .services { color: var(--on-accent); }
.foundation-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 24px; }
.foundation-grid > div { min-width: 0; }
.foundation .panel-body > p { max-width: 65ch; }

.hint { margin: 8px 0 0; color: var(--text-2); font-size: 0.875rem; }
kbd { font-family: var(--font-mono); font-size: 0.8125rem; padding: 1px 6px; background: var(--layer); border: 1px solid var(--layer-2); }

/* ---------- Narrower screens: lines move inside the expanded tile ---------- */
@media (max-width: 1023px) {
  .stage { min-height: 0; }
  .stage-lines { display: none; }
  .wrap[data-selected] .intro { opacity: 1; transform: none; }
  .panel-lines { display: flex; }
  .pillars { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .tile-head { min-height: 200px; }
  .foundation-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 599px) {
  .wrap { padding-block: 32px 48px; }
  .pillars { grid-template-columns: minmax(0, 1fr); }
  .tile-head { min-height: 0; }
  .tile-head .eyebrow { margin-top: 16px; }
  .services { margin-left: 0; }
  .foundation-grid { grid-template-columns: minmax(0, 1fr); }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}
</style>

<main class="wrap" id="wrap">
  <section class="stage" aria-live="polite">
    <div class="intro">
      <span class="eyebrow">IBM Cloud</span>
      <h1>Infrastructure as a Service</h1>
      <p>One foundation, four ways to run your workloads.</p>
    </div>
    <div class="stage-lines"><ol class="lines" id="stage-lines"></ol></div>
  </section>

  <div class="pillars" id="pillars"></div>
  <div id="foundation-slot"></div>

  <p class="hint">Select a pillar or the foundation to explore it. Select it again, click outside, or press <kbd>Esc</kbd> to return.</p>
</main>

<script>
// ---------------------------------------------------------------------------
// Content. "lines" are the four headline lines (placeholder text for now);
// "summary", "fit" and "blocks" fill the panel that grows out of the tile.
// ---------------------------------------------------------------------------
const PILLARS = [
  {
    id: "classic", icon: "i-classic", eyebrow: "IBM Cloud Classic", title: "Classic Infrastructure",
    lines: ["Overview", "Compute, Storage, and Network offerings", "Typical customers / use case", "Migration Plays"],
    summary: "IBM Cloud's original infrastructure platform. Bare metal and virtual servers run on VLAN-based networking you control down to the subnet, with dedicated hardware for workloads that need it.",
    fit: ["Lift-and-shift of existing x86 workloads", "Single-tenant bare metal and custom builds", "VMware estates on dedicated hosts"],
    blocks: ["Bare metal servers", "Virtual servers", "Gateway Appliance", "File & block storage", "VLANs & portable subnets"],
  },
  {
    id: "vpc", icon: "i-vpc", eyebrow: "IBM Cloud VPC", title: "Virtual Private Cloud",
    lines: ["Overview", "Comparison to classic", "Compute, Storage, and Network offerings", "Typical customers / use case"],
    summary: "Software-defined, logically isolated networks across multizone regions. Provision servers and storage in minutes and secure them with security groups and network ACLs, all through API, CLI or Terraform.",
    fit: ["Cloud-native and modernized applications", "Highly available, multizone deployments", "Infrastructure-as-code pipelines"],
    blocks: ["Virtual server instances", "Bare metal for VPC", "Block & file storage", "Load balancers", "VPN gateways", "Security groups"],
  },
  {
    id: "powervs", icon: "i-powervs", eyebrow: "IBM Power", title: "Power Virtual Server",
    lines: ["Overview", "Compute, Storage, and Network offerings", "Typical customers / use case", "Migration Plays"],
    summary: "IBM Power servers delivered as a service, running AIX, IBM i and Linux on Power next to your x86 cloud. Move existing Power workloads without re-platforming and connect them to VPC and on-premises networks.",
    fit: ["Data center exit for Power estates", "Disaster recovery for AIX and IBM i", "SAP on Power"],
    blocks: ["Power virtual server instances", "Tiered block storage", "Private subnets", "Transit Gateway", "Direct Link"],
  },
  {
    id: "ocpv", icon: "i-ocpv", eyebrow: "Red Hat OpenShift", title: "OpenShift Virtualization",
    lines: ["Overview", "Compute, Storage, and Network offerings", "Typical customers / use case", "Migration Plays"],
    summary: "Run virtual machines and containers side by side on Red Hat OpenShift, using bare metal worker nodes in IBM Cloud. VMs use the same Kubernetes tooling as containers, so teams can modernize at their own pace.",
    fit: ["VMware migrations onto one platform", "Mixed VM and container applications", "Gradual modernization of legacy VMs"],
    blocks: ["Red Hat OpenShift on IBM Cloud", "Bare metal workers", "OpenShift Data Foundation", "Migration Toolkit for Virtualization"],
  },
];

const FOUNDATION = {
  id: "iaas", eyebrow: "Foundation", title: "Infrastructure as a Service",
  lines: ["Natus error sit voluptatem", "Accusantium doloremque laudantium", "Totam rem aperiam eaque ipsa", "Quae ab illo inventore veritatis"],
  summary: "The shared layer under every pillar: compute, storage, networking and security that work the same way whichever platform runs the workload. Transit Gateway ties the pillars together and Direct Link brings in on-premises networks.",
  groups: [
    { icon: "i-compute", name: "Compute", items: ["Virtual servers", "Bare metal servers", "Power servers"] },
    { icon: "i-storage", name: "Storage", items: ["Block storage", "File storage", "Cloud Object Storage"] },
    { icon: "i-network", name: "Network", items: ["Transit Gateway", "Direct Link", "VPN and load balancers"] },
    { icon: "i-security", name: "Security", items: ["Key Protect", "Hyper Protect Crypto Services", "Secrets Manager"] },
  ],
};

// Pillars in the right half anchor their lines to the right edge
const RIGHT_SIDE = new Set(["powervs", "ocpv"]);

// --- small helpers ---------------------------------------------------------
const icon = (id, cls = "icon") => `<svg class="${cls}" aria-hidden="true" fill="currentColor"><use href="#${id}"/></svg>`;
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// Lines markup: numbered 01-04; CSS stacks them upward from the box.
function linesHTML(lines) {
  return lines.map((text, i) =>
    `<li style="animation-delay:${i * 140}ms"><span class="num">0${i + 1}</span><span>${esc(text)}</span></li>`
  ).join("");
}

function pillarHTML(p) {
  return `
  <article class="tile" data-id="${p.id}">
    <button class="tile-head" type="button" aria-expanded="false" aria-controls="panel-${p.id}">
      ${icon(p.icon)}
      <span class="eyebrow">${esc(p.eyebrow)}</span>
      <span class="tile-title">${esc(p.title)}</span>
      ${icon("i-chevron", "chevron")}
    </button>
    <div class="panel" id="panel-${p.id}" role="region" aria-label="${esc(p.title)} overview" inert>
      <div class="panel-inner"><div class="panel-body">
        <ol class="lines panel-lines"></ol>
        <p>${esc(p.summary)}</p>
        <div><h3 class="eyebrow">Good fit for</h3><ul>${p.fit.map((f) => `<li>${esc(f)}</li>`).join("")}</ul></div>
        <div><h3 class="eyebrow">Building blocks</h3><ul class="tags">${p.blocks.map((b) => `<li>${esc(b)}</li>`).join("")}</ul></div>
      </div></div>
    </div>
  </article>`;
}

function foundationHTML(f) {
  return `
  <article class="tile foundation" data-id="${f.id}">
    <button class="tile-head" type="button" aria-expanded="false" aria-controls="panel-${f.id}">
      <span class="eyebrow">${esc(f.eyebrow)}</span>
      <span class="tile-title">${esc(f.title)}</span>
      <span class="services">${f.groups.map((g) => `<span>${icon(g.icon, "")}${g.name}</span>`).join("")}</span>
      ${icon("i-chevron", "chevron")}
    </button>
    <div class="panel" id="panel-${f.id}" role="region" aria-label="${esc(f.title)} overview" inert>
      <div class="panel-inner"><div class="panel-body">
        <ol class="lines panel-lines"></ol>
        <p>${esc(f.summary)}</p>
        <div class="foundation-grid">
          ${f.groups.map((g) => `<div><h3 class="eyebrow">${g.name}</h3><ul>${g.items.map((i) => `<li>${esc(i)}</li>`).join("")}</ul></div>`).join("")}
        </div>
      </div></div>
    </div>
  </article>`;
}

// --- render ----------------------------------------------------------------
const wrap = document.getElementById("wrap");
const stageLines = document.getElementById("stage-lines");
document.getElementById("pillars").innerHTML = PILLARS.map(pillarHTML).join("");
document.getElementById("foundation-slot").innerHTML = foundationHTML(FOUNDATION);
const ALL = Object.fromEntries([...PILLARS, FOUNDATION].map((p) => [p.id, p]));

// --- state: which block is open (null = default view) ----------------------
let selected = null;

function select(id) {
  selected = id === selected ? null : id; // selecting the open one resets

  if (selected) wrap.dataset.selected = selected;
  else delete wrap.dataset.selected;

  document.querySelectorAll(".tile").forEach((tile) => {
    const active = tile.dataset.id === selected;
    tile.classList.toggle("is-active", active);
    tile.querySelector(".tile-head").setAttribute("aria-expanded", String(active));
    const panel = tile.querySelector(".panel");
    panel.inert = !active;
    // Refill the in-tile lines (narrow screens) so their animation replays
    tile.querySelector(".panel-lines").innerHTML = active ? linesHTML(ALL[selected].lines) : "";
  });

  // Stage lines (wide screens): re-render to replay the staggered rise
  stageLines.innerHTML = selected ? linesHTML(ALL[selected].lines) : "";
  stageLines.dataset.anchor = selected || "";
  stageLines.dataset.side = RIGHT_SIDE.has(selected) ? "right" : "left";
}

// Click a tile header to open it; click anywhere else (not a tile) to reset
document.addEventListener("click", (e) => {
  const head = e.target.closest(".tile-head");
  if (head) { select(head.closest(".tile").dataset.id); return; }
  if (selected && !e.target.closest(".tile")) select(selected);
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && selected) {
    const head = document.querySelector(`.tile[data-id="${selected}"] .tile-head`);
    select(selected);
    head && head.focus();
  }
});

// Optional deep link: #classic, #vpc, #powervs, #ocpv or #iaas opens that block
const fromHash = location.hash.slice(1);
if (ALL[fromHash]) select(fromHash);
</script>

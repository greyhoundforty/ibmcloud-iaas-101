<title>IBM PowerVS 101</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&family=IBM+Plex+Sans:wght@300;400;600&display=swap">
<style>
/* PowerVS 101. Same interaction as the VPC 101 and the PowerVS network map:
   lanes of practices, click one to trace where it is applied, and read the
   rule in the side panel.
   Carbon White by default. Gray 100 when data-mode="dark", shared with the
   other explorer pages. */
:root {
  color-scheme: light;
  --bg: #ffffff;
  --layer: #f4f4f4;
  --hover: #e8e8e8;
  --line: #c6c6c6;
  --line-subtle: #e0e0e0;
  --text: #161616;
  --text-2: #525252;
  --muted: #6f6f6f;
  --label: #0f62fe;
  --accent: #0f62fe;
  --focus: #0f62fe;
  --sidebar: #f4f4f4;
  --sidebar-w: 400px;
  --font-sans: 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif;
  --font-mono: 'IBM Plex Mono', Menlo, 'Courier New', monospace;
  --ease: cubic-bezier(0.2, 0, 0.38, 0.9);
  --blue: #0f62fe;   --blue-bg: #edf5ff;   --blue-edge: #a6c8ff;
  --purple: #8a3ffc; --purple-bg: #f6f2ff; --purple-edge: #d4bbff;
  --teal: #007d79;   --teal-bg: #d9fbfb;   --teal-edge: #3ddbd9;
  --magenta: #d02670;--magenta-bg: #fff0f7;--magenta-edge: #ffafd2;
  --cyan: #0072c3;   --cyan-bg: #e5f6ff;   --cyan-edge: #82cfff;
}
:root[data-mode="dark"] {
  color-scheme: dark;
  --bg: #161616;
  --layer: #262626;
  --hover: #333333;
  --line: #525252;
  --line-subtle: #393939;
  --text: #f4f4f4;
  --text-2: #c6c6c6;
  --muted: #a8a8a8;
  --label: #78a9ff;
  --accent: #0f62fe;
  --focus: #ffffff;
  --sidebar: #262626;
  --blue: #78a9ff;   --blue-bg: #001d6c;   --blue-edge: #0043ce;
  --purple: #be95ff; --purple-bg: #31135e; --purple-edge: #6929c4;
  --teal: #08bdba;   --teal-bg: #022b30;   --teal-edge: #007d79;
  --magenta: #ff7eb6;--magenta-bg: #510224;--magenta-edge: #9f1853;
  --cyan: #33b1ff;   --cyan-bg: #061727;   --cyan-edge: #00539a;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-sans);
  font-size: 16px;
  line-height: 1.5;
}
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.wrap {
  max-width: 1440px;
  margin-inline: auto;
  padding: 48px 16px 80px;
  transition: margin-right 240ms var(--ease);
}
body.is-open .wrap { margin-right: var(--sidebar-w); }

.eyebrow {
  margin: 0;
  font-family: var(--font-mono);
  font-size: 0.75rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--label);
}
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.top-actions { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.home-link { font-size: 0.875rem; color: var(--label); text-underline-offset: 3px; }
.home-link:hover { text-decoration: none; }
.mode-toggle {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  min-height: 40px;
  padding: 0 16px;
  background: transparent;
  border: 1px solid var(--line);
  cursor: pointer;
  font-size: 0.875rem;
}
.mode-toggle:hover { background: var(--hover); }
.mode-toggle svg { width: 16px; height: 16px; }
h1 {
  margin: 12px 0 0;
  font-size: clamp(2.25rem, 5vw, 3.5rem);
  font-weight: 300;
  line-height: 1.1;
  letter-spacing: -0.02em;
}
.lede { margin: 16px 0 0; max-width: 42rem; color: var(--text-2); }

.tools {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 12px;
  margin-top: 32px;
}
.search {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: min(100%, 280px);
  height: 40px;
  padding: 0 16px;
  background: var(--layer);
  border-bottom: 1px solid var(--text);
}
.search:focus-within { outline: 2px solid var(--focus); outline-offset: -2px; }
.search svg { width: 16px; height: 16px; flex: 0 0 auto; color: var(--text-2); }
.search input {
  flex: 1;
  min-width: 0;
  height: 100%;
  border: 0;
  background: transparent;
  outline: none;
}
.search input::placeholder { color: var(--muted); }
.hint { margin: 0; max-width: 68ch; font-size: 0.875rem; color: var(--text-2); }

.map { margin-top: 8px; }
.row {
  display: flex;
  align-items: flex-start;
  gap: 16px;
  padding: 16px 0;
}
.row + .row { border-top: 1px solid var(--line-subtle); }
.row-label {
  width: 132px;
  flex: 0 0 auto;
  padding-top: 12px;
  font-family: var(--font-mono);
  font-size: 0.6875rem;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--muted);
}
.row-cards { display: flex; flex-wrap: wrap; gap: 10px; flex: 1; min-width: 0; }

.row[data-lane="workload"]   { --lane: var(--blue);    --lane-bg: var(--blue-bg);    --lane-edge: var(--blue-edge); }
.row[data-lane="principles"] { --lane: var(--teal);    --lane-bg: var(--teal-bg);    --lane-edge: var(--teal-edge); }
.row[data-lane="controls"]   { --lane: var(--purple);  --lane-bg: var(--purple-bg);  --lane-edge: var(--purple-edge); }
.row[data-lane="features"]   { --lane: var(--cyan);    --lane-bg: var(--cyan-bg);    --lane-edge: var(--cyan-edge); }
.row[data-lane="patterns"]   { --lane: var(--magenta); --lane-bg: var(--magenta-bg); --lane-edge: var(--magenta-edge); }

.card {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  width: 240px;
  max-width: 100%;
  margin: 0;
  padding: 12px 14px;
  text-align: left;
  background: var(--layer);
  border: 1px solid transparent;
  border-left: 4px solid var(--lane);
  cursor: pointer;
  transition: background-color 120ms var(--ease), border-color 120ms var(--ease), opacity 160ms var(--ease);
}
.card:hover { background: var(--hover); }
.card svg { width: 20px; height: 20px; flex: 0 0 auto; margin-top: 1px; color: var(--lane); }
.card-name { display: block; font-size: 0.875rem; font-weight: 600; line-height: 1.3; }
.card-sub { display: block; margin-top: 2px; font-size: 0.75rem; font-weight: 400; line-height: 1.35; color: var(--text-2); }
.map.is-tracing .card.is-dimmed { opacity: 0.32; }
.card.is-reachable {
  background: var(--bg);
  border-color: var(--lane-edge);
  border-left-color: var(--lane);
}
.card.is-selected {
  background: var(--lane-bg);
  border-color: var(--lane);
  border-left-width: 4px;
}
.row[data-lane="workload"] .card { width: 280px; }

.stats {
  margin: 8px 0 0 148px;
  font-size: 0.75rem;
  color: var(--muted);
}
.empty {
  margin: 24px 0 0 148px;
  color: var(--text-2);
}

.sidebar {
  position: fixed;
  top: 0;
  right: 0;
  bottom: 0;
  z-index: 20;
  width: var(--sidebar-w);
  background: var(--sidebar);
  border-left: 1px solid var(--line-subtle);
  transform: translateX(100%);
  transition: transform 240ms var(--ease);
  overflow: auto;
}
body.is-open .sidebar { transform: translateX(0); }
.sidebar-close {
  position: absolute;
  top: 12px;
  right: 12px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 40px;
  height: 40px;
  padding: 0;
  background: transparent;
  border: 0;
  cursor: pointer;
}
.sidebar-close:hover { background: var(--hover); }
.sidebar-close svg { width: 20px; height: 20px; }
.sidebar-body { padding: 56px 24px 40px; }
.sb-lane {
  display: inline-block;
  margin: 0 0 12px;
  padding: 2px 8px;
  font-family: var(--font-mono);
  font-size: 0.6875rem;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}
.sb-lane[data-lane="workload"]   { color: var(--blue);    background: var(--blue-bg); }
.sb-lane[data-lane="principles"] { color: var(--teal);    background: var(--teal-bg); }
.sb-lane[data-lane="controls"]   { color: var(--purple);  background: var(--purple-bg); }
.sb-lane[data-lane="features"]   { color: var(--cyan);    background: var(--cyan-bg); }
.sb-lane[data-lane="patterns"]   { color: var(--magenta); background: var(--magenta-bg); }
.sidebar h2 { margin: 0; font-size: 1.75rem; font-weight: 400; line-height: 1.2; }
.sidebar .rule { margin: 12px 0 0; color: var(--text-2); }
.sidebar h3 { margin: 28px 0 8px; font-size: 0.875rem; font-weight: 600; }
.sidebar ul { margin: 0; padding-left: 1.15rem; }
.sidebar li { margin: 0 0 8px; }
.sidebar li:last-child { margin-bottom: 0; }
.traces { display: flex; flex-wrap: wrap; gap: 8px; margin: 0; padding: 0; list-style: none; }
.traces button {
  margin: 0;
  padding: 6px 12px;
  background: var(--bg);
  border: 1px solid var(--line);
  cursor: pointer;
  font-size: 0.8125rem;
}
.traces button:hover { background: var(--hover); }
.docs {
  display: inline-block;
  margin-top: 28px;
  color: var(--label);
  text-underline-offset: 3px;
}
.docs:hover { text-decoration: none; }

@media (max-width: 720px) {
  .wrap { padding-block: 32px 56px; }
  body.is-open .wrap { margin-right: 0; }
  .row { flex-direction: column; gap: 8px; }
  .row-label { width: auto; padding-top: 4px; }
  .card { width: 100%; }
  .row[data-lane="workload"] .card { width: 100%; }
  .stats, .empty { margin-left: 0; }
  .sidebar { width: 100%; }
}
@media (prefers-reduced-motion: reduce) {
  .wrap, .sidebar, .card { transition: none; }
}
</style>

      "Separate production from non-production.",
      "Plan non-overlapping address space before the first subnet. Transit Gateway and Direct Link inherit that plan.",

const EDGES = [
  ["pvs", "least"], ["pvs", "depth"], ["pvs", "isolate"], ["pvs", "visible"],
  ["least", "nsg"], ["least", "nag"], ["least", "public"],
  ["depth", "nsg"], ["depth", "vpcsg"], ["depth", "acl"], ["depth", "hub"], ["depth", "public"],
  ["isolate", "subnets"], ["isolate", "per"], ["isolate", "tgw"],
  ["visible", "at"], ["visible", "vpcsg"],
  ["nsg", "nag"], ["nsg", "subnets"], ["nsg", "public"], ["nsg", "per"], ["nsg", "at"],
  ["nag", "vpe"], ["nag", "tgw"],
  ["subnets", "per"],
  ["routes", "tgw"], ["routes", "hub"],
  ["per", "tgw"], ["per", "vpe"],
  ["tgw", "vpe"], ["tgw", "dl"], ["tgw", "hub"],
  ["vpe", "vpcsg"],
  ["vpcsg", "acl"], ["vpcsg", "hub"]
];

const ADJ = {};
Object.keys(NODES).forEach((id) => { ADJ[id] = []; });
EDGES.forEach(([a, b]) => { ADJ[a].push(b); ADJ[b].push(a); });

const LANE_LABEL = Object.fromEntries(LANES.map((lane) => [lane.id, lane.label]));
const ORDER = [];
LANES.forEach((lane) => {
  Object.entries(NODES).forEach(([id, node]) => {
    if (node.lane === lane.id) ORDER.push(id);
  });
});

const mapEl = document.getElementById("map");
const hintEl = document.getElementById("hint");
const statsEl = document.getElementById("stats");
const emptyEl = document.getElementById("empty");
const sidebar = document.getElementById("sidebar");
const sidebarBody = document.getElementById("sidebar-body");
const searchEl = document.getElementById("search");

let selected = null;
let query = "";

function esc(value) {
  return String(value).replace(/[&<>"']/g, (ch) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[ch]));
}

function renderMap() {
  mapEl.innerHTML = LANES.map((lane) => {
    const cards = ORDER.filter((id) => NODES[id].lane === lane.id).map((id) => {
      const node = NODES[id];
      const search = [node.name, node.sub, node.practice, ...(node.apply || []), node.watch || ""].join(" ").toLowerCase();
      return `<button class="card" type="button" data-id="${id}" data-search="${esc(search)}" aria-pressed="false">
        <svg aria-hidden="true" fill="currentColor"><use href="#${node.icon}"/></svg>
        <span><span class="card-name">${esc(node.name)}</span><span class="card-sub">${esc(node.sub)}</span></span>
      </button>`;
    }).join("");
    return `<div class="row" data-lane="${lane.id}">
      <p class="row-label">${esc(lane.label)}</p>
      <div class="row-cards">${cards}</div>
    </div>`;
  }).join("");
  mapEl.querySelectorAll(".card").forEach((card) => {
    card.addEventListener("click", () => toggle(card.dataset.id));
  });
}

function toggle(id) {
  open(selected === id ? null : id);
}

function open(id) {
  selected = id && NODES[id] ? id : null;
  const next = selected ? "#" + selected : location.pathname + location.search;
  if ((location.hash || "") !== (selected ? "#" + selected : "")) {
    history.pushState({ id: selected }, "", next);
  }
  paint();
}

function paint() {
  const q = query.trim().toLowerCase();
  const tracing = Boolean(selected) && !q;
  const near = new Set(selected ? [selected, ...ADJ[selected]] : []);
  let shown = 0;
  mapEl.classList.toggle("is-tracing", tracing);
  mapEl.querySelectorAll(".row").forEach((row) => {
    let rowShown = 0;
    row.querySelectorAll(".card").forEach((card) => {
      const id = card.dataset.id;
      const match = !q || card.dataset.search.includes(q);
      card.hidden = !match;
      card.classList.toggle("is-selected", id === selected && match);
      card.classList.toggle("is-reachable", tracing && id !== selected && near.has(id));
      card.classList.toggle("is-dimmed", tracing && !near.has(id));
      card.setAttribute("aria-pressed", String(id === selected));
      if (match) rowShown += 1;
    });
    row.hidden = rowShown === 0;
    shown += rowShown;
  });
  emptyEl.hidden = shown !== 0;
  const count = Object.keys(NODES).length;
  statsEl.textContent = selected
    ? NODES[selected].name + " · " + ADJ[selected].length + " connections"
    : count + " practices · " + EDGES.length + " connections";
  if (q) {
    hintEl.textContent = shown + (shown === 1 ? " practice matches." : " practices match.");
  } else if (selected) {
    const names = ADJ[selected].map((id) => NODES[id].name);
    hintEl.textContent = NODES[selected].name + " traces to " + names.join(", ") + ".";
  } else {
    hintEl.textContent = "Click a practice to trace where it is applied.";
  }
  paintSidebar();
}

function paintSidebar() {
  const openPanel = Boolean(selected);
  document.body.classList.toggle("is-open", openPanel);
  sidebar.setAttribute("aria-hidden", String(!openPanel));
  sidebar.inert = !openPanel;
  if (!openPanel) {
    sidebarBody.innerHTML = "";
    return;
  }
  const node = NODES[selected];
  const lane = LANES.find((item) => item.id === node.lane);
  const traces = ADJ[selected].map((id) =>
    `<li><button type="button" data-go="${id}">${esc(NODES[id].name)}</button></li>`
  ).join("");
  const apply = node.apply.map((item) => `<li>${esc(item)}</li>`).join("");
  const watch = node.watch ? `<h3>Watch</h3><p>${esc(node.watch)}</p>` : "";
  const docs = node.docs
    ? `<a class="docs" href="${esc(node.docs)}" target="_blank" rel="noopener noreferrer">${esc(node.docsLabel || "Docs")}</a>`
    : "";
  sidebarBody.innerHTML = `
    <p class="sb-lane" data-lane="${esc(node.lane)}">${esc(lane.label)}</p>
    <h2>${esc(node.name)}</h2>
    <p class="rule">${esc(node.practice)}</p>
    <h3>Apply it</h3>
    <ul>${apply}</ul>
    ${watch}
    <h3>Traces to</h3>
    <ul class="traces">${traces}</ul>
    ${docs}`;
  sidebarBody.querySelectorAll("[data-go]").forEach((button) => {
    button.addEventListener("click", () => open(button.dataset.go));
  });
}

searchEl.addEventListener("input", () => {
  query = searchEl.value;
  if (query.trim() && selected) {
    selected = null;
    if (location.hash) history.replaceState({ id: null }, "", location.pathname + location.search);
  }
  paint();
});
document.getElementById("sidebar-close").addEventListener("click", () => open(null));
document.addEventListener("keydown", (event) => {
  if (event.key === "Escape" && selected) open(null);
});
window.addEventListener("popstate", () => {
  const id = location.hash.slice(1);
  selected = NODES[id] ? id : null;
  paint();
});

renderMap();
const initial = location.hash.slice(1);
if (NODES[initial]) selected = initial;
paint();

const MODE_KEY = "iaas102-mode";
const modeBtn = document.getElementById("mode-toggle");
function applyMode(mode) {
  const dark = mode === "dark";
  if (dark) document.documentElement.dataset.mode = "dark";
  else delete document.documentElement.dataset.mode;
  modeBtn.setAttribute("aria-pressed", String(dark));
  document.getElementById("mode-label").textContent = dark ? "Light mode" : "Dark mode";
  document.getElementById("mode-icon").setAttribute("href", dark ? "#i-light" : "#i-asleep");
}
let savedMode = "light";
try { savedMode = localStorage.getItem(MODE_KEY) || "light"; } catch (e) { /* stay light */ }
applyMode(savedMode);
modeBtn.addEventListener("click", () => {
  const next = document.documentElement.dataset.mode === "dark" ? "light" : "dark";
  try { localStorage.setItem(MODE_KEY, next); } catch (e) { /* ignore */ }
  applyMode(next);
});
</script>
